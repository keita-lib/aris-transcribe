[project]
name = "aris-transcribe"
version = "0.1.0"
description = "Windows video/audio transcription: drop an mp4 and get .txt / .srt / .md (local Whisper)."
readme = "README.md"
license = "CC-BY-ND-4.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Keita Nakamori / QUETTA ROBOTICS" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "tkinterdnd2>=0.4",
    # faster-whisper 1.2 は av.open(metadata_errors=...) を使うが、PyAV 16 以降で廃止された
    "av>=11,<16",
]

[project.optional-dependencies]
# NVIDIA GPU で動かす場合（cuDNN は faster-whisper の依存 ctranslate2 に同梱されている）
gpu = ["nvidia-cublas-cu12"]

[project.gui-scripts]
aris-transcribe = "aris_transcribe.app:main"

[project.scripts]
aris-transcribe-cli = "aris_transcribe.cli:main"

[project.urls]
Homepage = "https://github.com/keita-lib/aris-transcribe"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
